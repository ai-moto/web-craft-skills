name: Validate pack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Leaked client names, credentials, local paths, broken links, and skill
      # counts that drifted apart. Runs before anything is published.
      - name: Pack hygiene
        run: node test/check-pack-hygiene.mjs

      - name: Scripts parse
        run: |
          for f in skills/*/scripts/*.mjs test/*.mjs; do
            node --check "$f"
          done

      # Every script must report a usage error rather than crashing or hanging
      # when invoked with no arguments.
      - name: Scripts handle missing arguments
        run: |
          # GitHub runs steps under `bash -e`, so a bare failing command aborts the
          # step before $? can be read. Capture the code in a || branch instead.
          rc=0
          for f in skills/*/scripts/*.mjs; do
            code=0
            node "$f" >/dev/null 2>&1 || code=$?
            if [ "$code" -ne 2 ]; then
              echo "::error file=$f::expected usage exit code 2, got $code"
              rc=1
            fi
          done
          exit $rc

      - name: Manifests are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.codex-plugin/plugin.json','utf8'))"
